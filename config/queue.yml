default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
  # SQLite is a single-writer database: run jobs one at a time so parallel
  # job threads don't collide on the write lock (database is locked).
  workers:
    - queues: "*"
      threads: 1
      processes: 1
      polling_interval: 0.1
